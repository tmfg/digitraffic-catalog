name: Run tests

on:
  workflow_dispatch:
    inputs:
      config-repo-branch:
        description: "Branch or tag of CI-repo"
        required: true
        default: "master"
  push:

jobs:
  run_tests:
    if: github.repository != 'tmfg/digitraffic-catalog'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # local-env builds its images from the CI repo checked out below.
      DIGITRAFFIC_CI_PATH: ${{ github.workspace }}/digitraffic-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout CI-repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.CONFIG_REPO_NAME }}
          ssh-key: ${{ secrets.CONFIG_REPO_SSH_KEY }}
          ref: ${{ inputs.config-repo-branch || 'master' }}
          path: digitraffic-ci

      - name: Start CKAN
        working-directory: local-env
        run: ./dev.sh up -d --build

      - name: Run tests
        working-directory: local-env
        run: ./dev.sh test

      - name: Collect Docker logs
        if: always()
        working-directory: local-env
        run: docker compose logs --no-color > docker-logs.txt 2>&1

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-logs
          path: ./local-env/docker-logs.txt
          retention-days: 30
