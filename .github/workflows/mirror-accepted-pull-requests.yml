name: "Mirror accepted pull requests to private"
on:
  pull_request_target:
    types:
      - closed
jobs:
  Mirror-action:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master' && github.repository == 'tmfg/digitraffic-catalog'
    runs-on: ubuntu-26.04
    steps:
      - name: Mirror
        uses: tmfg/digitraffic-actions@e12a350ed6e47b82bfb8affbc81c79a540beb162 # mirror/v3
        with:
          mirror-repo: ${{ secrets.PRIVATE_REPOSITORY_URL }}
          ssh-private-key: ${{ secrets.SSH_MIRROR_PRM_KEY }}
