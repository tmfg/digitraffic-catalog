# Local CKAN: `./dev.sh up` (or `docker compose up`) in this directory.
#
# Config: ckan.env (committed) and .env.local (gitignored, optional).
name: datakatalogi-local

include:
  - compose.services.yaml

services:
  ckan:
    build:
      context: ${DIGITRAFFIC_CI_PATH:?Set DIGITRAFFIC_CI_PATH to the CI repository checkout in local-env/.env}/aws/ckan
      dockerfile: ../docker/Dockerfile-catalog-ckan
      args:
        SETUP_DIR: ./setup
      additional_contexts:
        ckanext: ../ext
    env_file:
      - path: ckan.env
      - path: .env.local
        required: false
    environment:
      # pdb: one worker, no master, no threads. `CKAN_UWSGI_MODE= ./dev.sh up` runs the prod model.
      CKAN_UWSGI_MODE: ${CKAN_UWSGI_MODE-pdb}
    ports:
      - "${CKAN_PORT:-5000}:5000"
    volumes:
      - ../ext:/srv/app/ckanext
      - ./ckan/docker-entrypoint.d:/docker-entrypoint.d:ro
      - ckan_storage:/var/lib/ckan
    # pdb at a breakpoint: ./dev.sh attach
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5000/api/3/action/status_show"]
      interval: 10s
      timeout: 5s
      retries: 6
      # First start installs the extensions and runs migrations.
      start_period: 5m
    depends_on:
      catalog-postgresql:
        condition: service_healthy
      catalog-solr:
        condition: service_started
      catalog-redis:
        condition: service_started
      otel-collector:
        condition: service_started

  nginx:
    build:
      context: ${DIGITRAFFIC_CI_PATH:?Set DIGITRAFFIC_CI_PATH to the CI repository checkout in local-env/.env}/aws/nginx-catalog
      dockerfile: ../docker/Dockerfile-catalog-nginx
      args:
        VARIABLES_TEMPLATE_FILE: ./setup/server.variables.template
        ERROR_PAGES_CONFIG_FILE: ./setup/errorpages.conf
        NGINX_CONFIG_FILE: ./setup/nginx.conf
        OTEL_CONFIG_FILE: ./setup/otel.conf.local
        SECURITY_HEADERS_CONFIG_FILE: ./setup/security_headers.conf
        SERVER_CONFIG_FILE: ./setup/server.conf.local
        CUSTOM_PAGES_DIR: ./custompages
    environment:
      NGINX_CKAN_TARGET: http://ckan:5000
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      ckan:
        condition: service_started
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "14317:4317"
      - "14318:4318"
    command: ["--config", "/etc/otel-collector-config.yaml"]
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/jaeger:2.4.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "5778:5778"
      - "9411:9411"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  ckan_storage:
