version: 1
groups:
  - annotation: Digitraffic core settings
    options:
      - key: ckanext.digitraffic_core.organization_identifier_required
        type: bool
        default: false
        example: "true"
        description: >-
          Require every organisation to have at least one identifier: a Y-tunnus, an EUID or an
          EUDI. Switch it on only after every existing organisation has one, because saving an
          organisation without an identifier is rejected while it is on.
      - key: ckanext.digitraffic_core.vaco.enabled
        type: bool
        default: false
        example: "true"
        description: >-
          Enables:
          1. The running of commands `ckan digitraffic-vaco submit` and `ckan digitraffic-vaco poll`.
          2. The display of validation results on the resource/distribution page.
      - key: ckanext.digitraffic_core.vaco.api_base_url
        description: >-
          Address of VACO, without the `/api` path.
      - key: ckanext.digitraffic_core.vaco.token_url
        description: >-
          Trivore ID token address, where the catalog gets its access token for VACO.
      - key: ckanext.digitraffic_core.vaco.client_id
        description: >-
          The catalog's client id in Trivore ID.
      - key: ckanext.digitraffic_core.vaco.client_secret
        description: >-
          The catalog's client secret in Trivore ID.
