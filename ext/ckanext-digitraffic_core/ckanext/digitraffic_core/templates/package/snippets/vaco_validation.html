{% set vaco = h.vaco_validation(res) %}
{% if vaco %}
  <tr>
    <th scope="row">{{ _('Resource quality') }}</th>
    <td>
      <dl class="scheming-subfield-list vaco-validation">
        <dt class="dataset-label">{{ _('Validation result') }}</dt>
        <dd>
          <img src="{{ vaco.badge_url }}" height="24" alt="{{ _('VACO validation status') }}" title="{{ _('VACO validation status') }}">
        </dd>
        <dt class="dataset-label">{{ _('Data validation service') }}</dt>
        <dd>
          {% if vaco.magic_link %}
            <a href="{{ vaco.magic_link }}" target="_blank" rel="noopener noreferrer">{{ _('View in data validation service') }}</a>
          {% endif %}
        </dd>
      </dl>
    </td>
  </tr>
{% endif %}
